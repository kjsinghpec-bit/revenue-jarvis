[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "revenue-jarvis"
version = "1.0.0"
description = "Revenue Jarvis: a voice-first, page-cited Punjab revenue-law aide built on S. L. Bhumbak's Zameen Di Guide, with official acts as secondary sources."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Karamjot Singh Ichhponani" }]
license = { text = "Proprietary - private use" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "typer>=0.12",
  "rich>=13",
  "numpy>=1.26",
  "rank-bm25>=0.2.2",
  "sentence-transformers>=3.0",
  "pymupdf>=1.24",
  "pillow>=10",
  "edge-tts>=6.1",
]

[project.optional-dependencies]
voice = ["mlx-whisper>=0.4; platform_system == 'Darwin' and platform_machine == 'arm64'"]
voice-cpu = ["faster-whisper>=1.0"]
dev = ["pytest>=8", "ruff>=0.5", "httpx>=0.27"]

[project.scripts]
jarvis = "revenue_jarvis.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/revenue_jarvis"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP", "BLE"]
ignore = ["E501", "BLE001", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
